aid: avify
name: Avify
description: >-
  Avify is a WhatsApp-first commerce and CRM platform for small and medium-sized
  businesses (PYMEs) across Latin America. It centralizes conversations from
  WhatsApp, Instagram and Messenger and connects them to a real-time inventory
  system, an online store and catalog, a point-of-sale for physical stores,
  conversational marketing with AI agents, payment processing, shipping
  integrations and electronic invoicing. For developers, Avify exposes a GraphQL
  API and a REST API (base path /api/v1) authenticated with an api-key header,
  covering products, inventory, store locations, carts, orders and payment
  methods, plus order webhooks for create/update events. A public GraphQL
  sandbox is available for testing before going live.
